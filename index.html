<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel DUI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Estrutura do Painel usando SVG -->
  <div class="panel-container">
    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 320 340" fill="none">
      <!-- Fundo Escuro com Cantos Arredondados -->
      <rect width="320" height="340" rx="12" fill="#121214"/>
      <!-- Borda suave -->
      <rect x="0.5" y="0.5" width="319" height="339" rx="11.5" stroke="#1C1C1F" stroke-opacity="0.8"/>
    </svg>
    
    <!-- Área interna reservada para o teu conteúdo -->
    <div id="content" class="panel-content"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
